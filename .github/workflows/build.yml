name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q KitKatTube.zip
      - name: Patch versions
        run: |
          sed -i "s/7.4.2/8.5.2/" KitKatTube/build.gradle
          sed -i "s#desugar_jdk_libs:2.0.4#desugar_jdk_libs_nio:2.1.5#" KitKatTube/app/build.gradle
          sed -i "s/NewPipeExtractor:v0.24.2/NewPipeExtractor:v0.26.5/" KitKatTube/app/build.gradle
          sed -i 's/android:label="KitKatTube"/android:label="KitKat2"/' KitKatTube/app/src/main/AndroidManifest.xml
          grep -E "desugar|NewPipeExtractor" KitKatTube/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: KitKatTube
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KitKatTube-debug
          path: KitKatTube/app/build/outputs/apk/debug/app-debug.apk
